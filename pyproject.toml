[build-system]
requires = [
    "setuptools>=77",
    "setuptools-scm>=8",
    "cython>=3.1",
    "numpy>=2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "scikit-allel2"
dynamic = ["version"]
description = "A Python package for exploring and analysing genetic variation data."
readme = "README.rst"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Alistair Miles", email = "alistair.miles@sanger.ac.uk" },
]
maintainers = [
    { name = "Loïc Talignani", email = "loic.talignani@ird.fr" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.0",
    "dask[array]",
    "zarr>=3.1",
]

[project.optional-dependencies]
optional = [
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas>=3.0",
    "protopunica",
    "scikit-learn",
    "h5py",
    "numexpr",
    "numcodecs",
    "hmmlearn",
]
test = [
    "scikit-allel2[optional]",
    "pytest",
    "pytest-cov",
    "flake8",
]
docs = [
    "numpydoc",
    "mock",
    "sphinx",
    "sphinx-issues",
]

[project.urls]
Homepage = "https://github.com/ltalignani/scikit-allel2"
"Bug Tracker" = "https://github.com/ltalignani/scikit-allel2/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["allel2*"]

[tool.setuptools_scm]
version_file = "allel2/version.py"

[tool.cibuildwheel]
# CPython 3.12-3.14 (no free-threading), manylinux only (no musl)
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
# each wheel is installed in a clean environment and reads a test VCF
test-command = "python {project}/ci/smoke_wheel.py"

[tool.cibuildwheel.linux]
# x86_64 and aarch64 are each built on a native runner
archs = ["native"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
