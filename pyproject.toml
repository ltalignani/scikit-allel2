[build-system]
requires = [
    "setuptools>=77",
    "setuptools-scm>=8",
    "cython>=3.1",
    "numpy>=2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "scikit-allel2"
dynamic = ["version"]
description = "A Python package for exploring and analysing genetic variation data."
readme = "README.rst"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Alistair Miles", email = "alistair.miles@sanger.ac.uk" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.0",
    "dask[array]",
]

[project.optional-dependencies]
optional = [
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas>=3.0",
    "protopunica",
    "scikit-learn",
    "h5py",
    "numexpr",
    "numcodecs",
    "zarr>=3.1",
    "hmmlearn",
]
test = [
    "scikit-allel2[optional]",
    "pytest",
    "pytest-cov",
    "flake8",
]
docs = [
    "numpydoc",
    "mock",
    "sphinx",
    "sphinx-issues",
    # allel2.chunked imports zarr
    "zarr>=3.1",
]

[project.urls]
Homepage = "https://github.com/ltalignani/scikit-allel2"
"Bug Tracker" = "https://github.com/ltalignani/scikit-allel2/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["allel2*"]

[tool.setuptools_scm]
version_file = "allel2/version.py"
