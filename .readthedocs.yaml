# ReadTheDocs: "latest" is built from the default branch, "stable" from the
# most recent release tag.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # setuptools-scm needs the history to compute the version
      - git fetch --unshallow || true

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
