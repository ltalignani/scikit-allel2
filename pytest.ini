[pytest]
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS IGNORE_EXCEPTION_DETAIL
# a deprecation in a dependency fails the suite, so API changes are handled before
# they break users; later lines take precedence
filterwarnings =
    error::DeprecationWarning
    error::FutureWarning
    # chunked is deprecated on purpose, until its removal in 3.0
    ignore:allel2.chunked is deprecated:DeprecationWarning
    # zarr warns when storing fixed-length strings in format 3 (ADR 0002)
    ignore:The data type .* does not have a Zarr V3 specification:FutureWarning
