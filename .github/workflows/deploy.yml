name: Deploy

# A tag v* builds the wheels and the sdist, then publishes them once the
# maintainer approves: pre-releases (a, b, rc, dev) go to TestPyPI, final
# releases to PyPI. Pull requests touching the packaging only build and test.
on:
  push:
    tags:
      - v*
  pull_request:
    paths:
      - .github/workflows/deploy.yml
      - ci/**
      - pyproject.toml
      - setup.py
      - MANIFEST.in

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # manylinux x86_64, manylinux aarch64, macOS arm64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs the tags to compute the version
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and smoke-test wheels
        # configuration in pyproject.toml, [tool.cibuildwheel]
        run: |
          python -m pip install "cibuildwheel>=4"
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install build twine
          python -m build --sdist
          # PyPI rejects a README that does not render
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  check:
    name: Check versions and choose the index
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      index: ${{ steps.check.outputs.index }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: check
        name: Every file carries the version of the tag
        run: |
          python -m pip install packaging
          ls dist
          # on its own line, so that a failed check fails the step
          index=$(python ci/check_dist.py "$GITHUB_REF_NAME" dist)
          echo "index=$index" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to ${{ needs.check.outputs.index }}
    needs: check
    runs-on: ubuntu-latest
    # the testpypi and pypi environments require the maintainer's approval
    environment:
      name: ${{ needs.check.outputs.index }}
      url: ${{ needs.check.outputs.index == 'pypi' && 'https://pypi.org/p/scikit-allel2' || 'https://test.pypi.org/p/scikit-allel2' }}
    permissions:
      # Trusted Publishing: no token is stored
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ needs.check.outputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
