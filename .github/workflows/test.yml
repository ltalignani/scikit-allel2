name: Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: ${{ matrix.platform }} / py${{ matrix.python-version }} / ${{ matrix.deps }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        deps:
          - latest
        include:
          # lowest supported versions of the core dependencies
          - platform: ubuntu-latest
            python-version: "3.12"
            deps: minimum

    steps:

      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs the history to compute the version
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y install tabix

      - name: Pin minimum dependency versions
        if: matrix.deps == 'minimum'
        run: |
          printf 'numpy==2.0.*\nzarr==3.1.*\npandas==3.0.*\n' > constraints.txt
          echo "PIP_CONSTRAINT=$PWD/constraints.txt" >> "$GITHUB_ENV"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip list

      - name: Check minimum dependency versions
        if: matrix.deps == 'minimum'
        run: |
          python -c "
          import numpy, zarr, pandas
          assert numpy.__version__.startswith('2.0.'), numpy.__version__
          assert zarr.__version__.startswith('3.1.'), zarr.__version__
          assert pandas.__version__.startswith('3.0.'), pandas.__version__
          "

      - name: Lint
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 allel2 --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 allel2 --count --exit-zero --max-line-length=127 --statistics

      - name: Test
        run: |
          pytest -v allel2
