[package]
name = "prototype_vcf_gt"
version = "0.1.0"
edition = "2024"

[lib]
name = "_prototype_rust_vcf"
crate-type = ["cdylib"]

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
flate2 = "1.1.10"
memchr = "2.8.3"
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
rayon = "1.12.0"
